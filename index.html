<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>地理・気候クイズ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system, BlinkMacSystemFont, "Hiragino Sans",
    "Yu Gothic", sans-serif;
  background: #f4f7fb;
  color: #172033;
}

button, select {
  font: inherit;
}

.app {
  width: min(760px, 100%);
  margin: 0 auto;
  padding: 18px 16px 40px;
}

header {
  text-align: center;
  padding: 18px 0 22px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  color: #687386;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

h2, h3 {
  margin-top: 0;
}

button {
  border: 0;
  border-radius: 13px;
  padding: 13px 16px;
  cursor: pointer;
  background: #e9eef7;
  color: #172033;
  font-weight: 700;
}

button:active {
  transform: scale(.98);
}

.primary {
  width: 100%;
  background: #315bea;
  color: white;
  font-size: 17px;
}

.secondary {
  width: 100%;
  margin-top: 10px;
}

.option-grid {
  display: grid;
  gap: 11px;
  margin-top: 18px;
}

.option {
  width: 100%;
  text-align: left;
  background: #f1f4f9;
  border: 2px solid transparent;
  min-height: 56px;
}

.option:hover {
  border-color: #315bea;
}

.option.correct {
  background: #dff6e7;
  border-color: #28a65a;
}

.option.wrong {
  background: #ffe2e2;
  border-color: #e04d4d;
}

.option.disabled {
  pointer-events: none;
}

.row {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.row button {
  flex: 1;
  min-width: 110px;
}

.choice-group {
  margin-bottom: 18px;
}

.choice-title {
  font-weight: 700;
  margin-bottom: 9px;
}

.choice-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.choice-buttons button.selected {
  background: #315bea;
  color: white;
}

.choice-buttons button.selected.weak {
  background: #f0a400;
}

.progress {
  height: 9px;
  background: #e4e9f2;
  border-radius: 999px;
  overflow: hidden;
  margin: 12px 0 18px;
}

.progress-bar {
  height: 100%;
  background: #315bea;
  width: 0%;
  transition: width .25s;
}

.question-meta {
  color: #687386;
  font-size: 14px;
  margin-bottom: 9px;
}

.question {
  font-size: 21px;
  line-height: 1.6;
  font-weight: 800;
}

.feedback {
  margin-top: 16px;
  padding: 15px;
  border-radius: 13px;
  line-height: 1.6;
}

.feedback.correct {
  background: #e5f8ec;
  color: #176936;
}

.feedback.wrong {
  background: #ffe8e8;
  color: #9b2525;
}

.hidden {
  display: none !important;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat {
  text-align: center;
  background: #f2f5fa;
  border-radius: 14px;
  padding: 14px 8px;
}

.stat-number {
  display: block;
  font-size: 25px;
  font-weight: 800;
}

.stat-label {
  color: #687386;
  font-size: 12px;
}

.result-item {
  padding: 12px 0;
  border-bottom: 1px solid #e4e8ef;
}

.result-item:last-child {
  border-bottom: 0;
}

.result-wrong {
  color: #b62c2c;
  font-weight: 700;
}

.result-correct {
  color: #258447;
  font-weight: 700;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 999px;
  background: #edf1f7;
  color: #596477;
  font-size: 12px;
  margin-right: 5px;
}

.badge.weak {
  background: #fff0c7;
  color: #946900;
}

.empty {
  text-align: center;
  color: #687386;
  padding: 30px 10px;
}

.small {
  font-size: 13px;
  color: #687386;
  line-height: 1.6;
}

.favorite {
  background: #fff4d2;
  color: #825c00;
}

@media (max-width: 500px) {
  .app {
    padding: 12px 12px 30px;
  }

  header h1 {
    font-size: 24px;
  }

  .card {
    padding: 16px;
    border-radius: 17px;
  }

  .question {
    font-size: 19px;
  }

  .choice-buttons {
    grid-template-columns: 1fr;
  }

  .stat-grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>地理・気候クイズ</h1>
  <p>気候分野を効率よく覚えよう</p>
</header>


<!-- =========================================
     HOME
========================================= -->

<section id="homeScreen">

  <div class="card">

    <h2>クイズを始める</h2>

    <div class="choice-group">

      <div class="choice-title">
        問題数
      </div>

      <div class="choice-buttons">

        <button
          data-count="10"
          class="count-btn selected"
        >
          10問
        </button>

        <button
          data-count="20"
          class="count-btn"
        >
          20問
        </button>

        <button
          data-count="all"
          class="count-btn"
        >
          全問
        </button>

      </div>

    </div>


    <div class="choice-group">

      <div class="choice-title">
        分野
      </div>

      <select
        id="categorySelect"
        style="
          width:100%;
          padding:13px;
          border-radius:12px;
          border:1px solid #d7ddea;
        "
      >

        <option value="all">
          すべて
        </option>

        <option value="基本">
          気候の基本
        </option>

        <option value="大気大循環">
          大気大循環
        </option>

        <option value="ケッペン">
          ケッペンの気候区分
        </option>

        <option value="熱帯">
          熱帯
        </option>

        <option value="乾燥帯">
          乾燥帯
        </option>

        <option value="温帯">
          温帯
        </option>

      </select>

    </div>


    <div class="choice-group">

      <div class="choice-title">
        出題形式
      </div>

      <div class="choice-buttons">

        <button
          data-direction="term"
          class="direction-btn selected"
        >
          用語→意味
        </button>

        <button
          data-direction="meaning"
          class="direction-btn"
        >
          意味→用語
        </button>

        <button
          data-direction="random"
          class="direction-btn"
        >
          ランダム
        </button>

      </div>

    </div>


    <button
      id="startButton"
      class="primary"
    >
      クイズ開始
    </button>

  </div>


  <div class="card">

    <h2>復習</h2>

    <button
      id="weakButton"
      class="secondary favorite"
    >
      ⭐ 苦手問題から出題
    </button>

    <button
      id="mistakeButton"
      class="secondary"
    >
      ❌ 間違えた問題から出題
    </button>

    <p
      id="weakInfo"
      class="small"
    ></p>

  </div>


  <div class="card">

    <h2>学習記録</h2>

    <div class="stat-grid">

      <div class="stat">
        <span
          id="totalAnswered"
          class="stat-number"
        >
          0
        </span>

        <span class="stat-label">
          回答数
        </span>
      </div>


      <div class="stat">

        <span
          id="totalCorrect"
          class="stat-number"
        >
          0
        </span>

        <span class="stat-label">
          正解数
        </span>

      </div>


      <div class="stat">

        <span
          id="overallRate"
          class="stat-number"
        >
          0%
        </span>

        <span class="stat-label">
          正答率
        </span>

      </div>

    </div>

  </div>

</section>


<!-- =========================================
     QUIZ
========================================= -->

<section
  id="quizScreen"
  class="hidden"
>

  <div class="card">

    <div class="question-meta">

      <span id="questionNumber"></span>

      <span
        id="questionCategory"
        class="badge"
      ></span>

      <span
        id="questionDirection"
        class="badge"
      ></span>

    </div>


    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>


    <div
      id="questionText"
      class="question"
    ></div>


    <div
      id="options"
      class="option-grid"
    ></div>


    <div
      id="feedback"
      class="feedback hidden"
    ></div>


    <div
      class="row"
      style="margin-top:15px;"
    >

      <button
        id="weakToggle"
        class="favorite"
      >
        ⭐ 苦手に登録
      </button>

      <button
        id="nextButton"
        class="primary hidden"
      >
        次の問題
      </button>

    </div>

  </div>

</section>


<!-- =========================================
     RESULT
========================================= -->

<section
  id="resultScreen"
  class="hidden"
>

  <div class="card">

    <h2>結果</h2>

    <div class="stat-grid">

      <div class="stat">

        <span
          id="resultCorrect"
          class="stat-number"
        >
          0
        </span>

        <span class="stat-label">
          正解
        </span>

      </div>


      <div class="stat">

        <span
          id="resultTotal"
          class="stat-number"
        >
          0
        </span>

        <span class="stat-label">
          問題
        </span>

      </div>


      <div class="stat">

        <span
          id="resultRate"
          class="stat-number"
        >
          0%
        </span>

        <span class="stat-label">
          正答率
        </span>

      </div>

    </div>


    <p
      id="resultMessage"
      style="
        text-align:center;
        font-weight:700;
        margin-top:20px;
      "
    ></p>

  </div>


  <div class="card">

    <h2>今回の結果</h2>

    <div id="resultList"></div>

  </div>


  <div class="card">

    <button
      id="retryButton"
      class="primary"
    >
      もう一度挑戦
    </button>

    <button
      id="homeButton"
      class="secondary"
    >
      ホームへ戻る
    </button>

  </div>

</section>

</div>

// =============================================
// Storage
// =============================================

function loadStorage(
  key,
  fallback
) {

  try {

    const value =
      localStorage.getItem(key);

    return value
      ? JSON.parse(value)
      : fallback;

  } catch {

    return fallback;

  }

}


function saveStorage(
  key,
  value
) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  } catch {

    // 保存できない環境でも
    // クイズ自体は継続する

  }

}


// =============================================
// Utility
// =============================================

function shuffle(array) {

  const result =
    [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }


  return result;

}


function getQuestionById(id) {

  return QUESTIONS.find(
    q => q.id === id
  );

}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

// =============================================
// 選択肢生成
//
// ★今回の改善ポイント
// =============================================

function createOptions(
  direction
) {

  /*
    用語 → 意味
      正解 = meaning

    意味 → 用語
      正解 = term
  */

  const answer =
    direction === "term"
      ? currentQuestion.meaning
      : currentQuestion.term;


  /*
    候補を優先順位ごとに管理する。

    priority 0
      → ほぼ同じ分野

    priority 1
      → 関連する分野

    priority 2
      → 最後の補充
  */

  const candidates = [];


  function addCandidates(
    questions,
    priority
  ) {

    shuffle(questions)
      .forEach(q => {

        if (
          q.id === currentQuestion.id
        ) {
          return;
        }


        const value =
          direction === "term"
            ? q.meaning
            : q.term;


        candidates.push({
          value,
          priority
        });

      });

  }


  // =========================================
  // ケッペン
  // =========================================

  if (
    currentQuestion.category ===
    "ケッペン"
  ) {

    /*
      A/B/C/D/E
    */

    const mainClimateTerms = [
      "A気候",
      "B気候",
      "C気候",
      "D気候",
      "E気候"
    ];


    /*
      Af/Aw/Am/BW/BS...
    */

    const climateCodes = [
      "Af",
      "Aw",
      "Am",
      "BW",
      "BS",
      "Cfb",
      "Cs",
      "Cw",
      "ET",
      "EF"
    ];


    /*
      A/B/C/D/Eの問題なら
      A/B/C/D/Eだけを優先
    */

    if (
      mainClimateTerms.includes(
        currentQuestion.term
      )
    ) {

      addCandidates(
        QUESTIONS.filter(q =>
          q.category === "ケッペン" &&
          mainClimateTerms.includes(
            q.term
          )
        ),
        0
      );

    }


    /*
      Af/Aw/Am/BW/BSなどなら
      記号同士を優先
    */

    else if (
      climateCodes.includes(
        currentQuestion.term
      )
    ) {

      addCandidates(
        QUESTIONS.filter(q =>
          q.category === "ケッペン" &&
          climateCodes.includes(
            q.term
          )
        ),
        0
      );

    }


    /*
      ケッペン全体を次の候補にする
    */

    addCandidates(
      QUESTIONS.filter(q =>
        q.category === "ケッペン"
      ),
      1
    );

  }


  // =========================================
  // 大気大循環
  // =========================================

  else if (
    currentQuestion.category ===
    "大気大循環"
  ) {

    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "大気大循環"
      ),
      0
    );


    /*
      基本用語は補助候補
    */

    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "基本"
      ),
      1
    );

  }


  // =========================================
  // 基本
  // =========================================

  else if (
    currentQuestion.category ===
    "基本"
  ) {

    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "基本"
      ),
      0
    );


    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "大気大循環"
      ),
      1
    );

  }


  // =========================================
  // 熱帯
  // =========================================

  else if (
    currentQuestion.category ===
    "熱帯"
  ) {

    /*
      熱帯問題同士を最優先
    */

    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "熱帯"
      ),
      0
    );


    /*
      熱帯に直接関係する
      ケッペンの熱帯気候
    */

    addCandidates(
      QUESTIONS.filter(q =>
        q.category === "ケッペン" &&
        [
          "Af",
          "Aw",
          "Am"
        ].includes(q.term)
      ),
      1
    );

  }


  // =========================================
  // 乾燥帯
  // =========================================

  else if (
    currentQuestion.category ===
    "乾燥帯"
  ) {

    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "乾燥帯"
      ),
      0
    );


    /*
      乾燥帯に直接関係する
      ケッペンのB気候
    */

    addCandidates(
      QUESTIONS.filter(q =>
        q.category === "ケッペン" &&
        [
          "B気候",
          "BW",
          "BS"
        ].includes(q.term)
      ),
      1
    );

  }


  // =========================================
  // 温帯
  // =========================================

  else if (
    currentQuestion.category ===
    "温帯"
  ) {

    addCandidates(
      QUESTIONS.filter(q =>
        q.category ===
        "温帯"
      ),
      0
    );


    /*
      温帯に直接関係する
      ケッペン
    */

    addCandidates(
      QUESTIONS.filter(q =>
        q.category === "ケッペン" &&
        [
          "C気候",
          "Cfb",
          "Cs",
          "Cw"
        ].includes(q.term)
      ),
      1
    );

  }


  // =========================================
  // 重複を除去
  // =========================================

  const unique = [];

  const used =
    new Set([answer]);


  candidates
    .sort((a, b) => {

      if (
        a.priority !==
        b.priority
      ) {

        return (
          a.priority -
          b.priority
        );

      }


      return (
        Math.random() - 0.5
      );

    })
    .forEach(candidate => {

      if (
        !used.has(
          candidate.value
        )
      ) {

        used.add(
          candidate.value
        );

        unique.push(
          candidate.value
        );

      }

    });


  // =========================================
  // ダミー3つ
  // =========================================

  let distractors =
    unique.slice(0, 3);


  // =========================================
  // 万一3つ足りない場合
  //
  // 完全な無関係問題ではなく、
  // 「関連カテゴリー」だけから補充
  // =========================================

  if (
    distractors.length < 3
  ) {

    let fallbackCategories = [];


    switch (
      currentQuestion.category
    ) {

      case "基本":

        fallbackCategories = [
          "大気大循環"
        ];

        break;


      case "大気大循環":

        fallbackCategories = [
          "基本"
        ];

        break;


      case "ケッペン":

        fallbackCategories = [
          "熱帯",
          "乾燥帯",
          "温帯"
        ];

        break;


      case "熱帯":

        fallbackCategories = [
          "ケッペン"
        ];

        break;


      case "乾燥帯":

        fallbackCategories = [
          "ケッペン"
        ];

        break;


      case "温帯":

        fallbackCategories = [
          "ケッペン"
        ];

        break;

    }


    const fallback =
      QUESTIONS.filter(q =>

        q.id !==
        currentQuestion.id &&

        fallbackCategories.includes(
          q.category
        )

      );


    shuffle(fallback)
      .forEach(q => {

        if (
          distractors.length >= 3
        ) {
          return;
        }


        const value =
          direction === "term"
            ? q.meaning
            : q.term;


        if (
          !used.has(value)
        ) {

          used.add(value);

          distractors.push(
            value
          );

        }

      });

  }


  // =========================================
  // 4択完成
  // =========================================

  const choices =
    shuffle([
      answer,
      ...distractors
        .slice(0, 3)
    ]);


  // =========================================
  // 表示
  // =========================================

  options.innerHTML = "";


  choices.forEach(
    choice => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "option";


      button.textContent =
        choice;


      button.addEventListener(
        "click",
        () =>
          answerQuestion(
            choice,
            answer
          )
      );


      options.appendChild(
        button
      );

    }
  );

}


// =============================================
// 回答
// =============================================

function answerQuestion(
  selected,
  answer
) {

  const buttons =
    [
      ...options.querySelectorAll(
        "button"
      )
    ];


  buttons.forEach(
    button => {

      button.classList.add(
        "disabled"
      );


      if (
        button.textContent ===
        answer
      ) {

        button.classList.add(
          "correct"
        );

      }


      if (
        button.textContent ===
        selected &&
        selected !== answer
      ) {

        button.classList.add(
          "wrong"
        );

      }

    }
  );


  const isCorrect =
    selected === answer;


  stats.answered++;


  if (isCorrect) {

    stats.correct++;


    feedback.className =
      "feedback correct";


    feedback.innerHTML =
      `⭕ 正解！<br><br>${
        escapeHTML(
          currentQuestion.explanation
        )
      }`;

  }


  else {

    feedback.className =
      "feedback wrong";


    feedback.innerHTML =
      `❌ 不正解<br><br>
       正解：
       <strong>${
         escapeHTML(answer)
       }</strong>
       <br><br>
       ${
         escapeHTML(
           currentQuestion.explanation
         )
       }`;


    addMistake(
      currentQuestion.id
    );

  }


  results.push({

    id:
      currentQuestion.id,

    correct:
      isCorrect,

    selected:
      selected,

    answer:
      answer

  });


  saveStorage(
    "stats",
    stats
  );


  updateHomeStats();


  feedback.classList.remove(
    "hidden"
  );


  nextButton.classList.remove(
    "hidden"
  );


  updateWeakButton();

}

    updateWeakButton();

);

    "resultTotal"
  ).textContent =
    total;


  document.getElementById(
    "resultRate"
  ).textContent =
    `${rate}%`;


  let message;


  if (
    rate === 100
  ) {

    message =
      "完璧！この分野はかなり強い！";

  }


  else if (
    rate >= 80
  ) {

    message =
      "かなりいい感じ！";

  }


  else if (
    rate >= 60
  ) {

    message =
      "あと少し！間違えた問題を復習しよう。";

  }


  else {

    message =
      "苦手問題を復習してもう一度挑戦しよう！";

  }


  document.getElementById(
    "resultMessage"
  ).textContent =
    message;


  const list =
    document.getElementById(
      "resultList"
    );


  list.innerHTML =
    "";


  results.forEach(
    result => {

      const q =
        getQuestionById(
          result.id
        );


      if (!q) {
        return;
      }


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "result-item";


      div.innerHTML = `
        <div>

          <span class="badge">
            ${escapeHTML(
              q.category
            )}
          </span>

          <span class="${
            result.correct
              ? "result-correct"
              : "result-wrong"
          }">

            ${
              result.correct
                ? "○ 正解"
                : "× 不正解"
            }

          </span>

        </div>


        <div
          style="
            margin-top:6px;
            font-weight:700;
          "
        >
          ${escapeHTML(
            q.term
          )}
        </div>


        <div class="small">
          ${escapeHTML(
            q.meaning
          )}
        </div>
      `;


      list.appendChild(
        div
      );

    }
  );


  document.getElementById(
    "progressBar"
  ).style.width =
    "100%";


  updateHomeStats();

}


// =============================================
// もう一度
// =============================================

document.getElementById(
  "retryButton"
).addEventListener(
  "click",
  () => {

    resultScreen.classList.add(
      "hidden"
    );

    homeScreen.classList.remove(
      "hidden"
    );

  }
);


// =============================================
// ホームへ
// =============================================

document.getElementById(
  "homeButton"
).addEventListener(
  "click",
  () => {

    resultScreen.classList.add(
      "hidden"
    );

    homeScreen.classList.remove(
      "hidden"
    );

  }
);


// =============================================
// 統計
// =============================================

function updateHomeStats() {

  document.getElementById(
    "totalAnswered"
  ).textContent =
    stats.answered;


  document.getElementById(
    "totalCorrect"
  ).textContent =
    stats.correct;


  const rate =
    stats.answered === 0
      ? 0
      : Math.round(
          stats.correct /
          stats.answered *
          100
        );


  document.getElementById(
    "overallRate"
  ).textContent =
    `${rate}%`;


  updateWeakInfo();

}


// =============================================
// 苦手・間違い情報
// =============================================

function updateWeakInfo() {

  const weakCount =
    weakQuestions
      .map(getQuestionById)
      .filter(Boolean)
      .length;


  const mistakeCount =
    mistakeQuestions
      .map(getQuestionById)
      .filter(Boolean)
      .length;


  document.getElementById(
    "weakInfo"
  ).textContent =
    `⭐ 苦手登録：${weakCount}問　／　❌ 間違えた問題：${mistakeCount}問`;

}


// =============================================
// 初期化
// =============================================

updateHomeStats();

</script>

</body>
</html>
